<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>Parkimi - Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }

      .icon {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 24px;
        font-weight: 800;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.55;
      }

      button {
        width: 100%;
        margin-top: 22px;
        border: 0;
        border-radius: 14px;
        background: #1d4ed8;
        color: #ffffff;
        padding: 13px 16px;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">P</div>
      <h1>Nuk ka lidhje interneti</h1>
      <p>
        Faqet qe jane hapur me pare mund te shfaqen nga memoria. Veprimet e
        parkimit kerkojne internet per te shmangur ndryshime te dyfishta.
      </p>
      <button type="button" onclick="window.location.reload()">Provo perseri</button>
    </main>
  </body>
</html>
