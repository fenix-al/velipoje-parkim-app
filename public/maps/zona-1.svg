<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#e8ede4"/>
  <!-- Roads -->
  <rect x="0" y="360" width="1200" height="80" fill="#c8c8c8"/>
  <rect x="560" y="0" width="80" height="800" fill="#c8c8c8"/>
  <!-- Road markings -->
  <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="3" stroke-dasharray="40 20"/>
  <line x1="600" y1="0" x2="600" y2="800" stroke="white" stroke-width="3" stroke-dasharray="40 20"/>
  <!-- Parking area background -->
  <rect x="20" y="60" width="520" height="280" fill="#f5f5f0" rx="4"/>
  <rect x="20" y="460" width="520" height="280" fill="#f5f5f0" rx="4"/>
  <rect x="660" y="60" width="520" height="280" fill="#f5f5f0" rx="4"/>
  <rect x="660" y="460" width="520" height="280" fill="#f5f5f0" rx="4"/>
  <!-- Label -->
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#333">ZONA 1 — PARKING MAP PLACEHOLDER</text>
  <text x="600" y="780" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">Zëvendësoni me foton reale të zonës: /public/maps/zona-1.jpg</text>
</svg>